name: houjin_bangou
title: 国税庁法人番号
description: |-
  国税庁が公表する全国の法人番号と、商号・所在地・法人種別・法人番号指定年月日です。現存する約 500 万法人の最新の情報と、閉鎖した法人を含む商号・所在地の変更履歴を収録しています。法人番号で他のデータセットと結合できます。

  出典：国税庁法人番号公表サイト（国税庁）。国税庁法人番号システムの Web-API 機能を利用して取得した情報をもとに作成していますが、内容は国税庁によって保証されたものではありません。公共データ利用規約（第1.0版）に準拠した利用条件のもとで再配布しています。最新性・正確性・完全性等が保証されたものではありません。

name: "houjin_bangou"
version: "1.0.0"

profile: "houjin_bangou"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "shared/macros"]
snapshot-paths: ["snapshots"]

# raw は incremental。--full-refresh で作り直すと、置き換え前のテーブルが
# __dbt_backup として残ったまま run が終わり、そのまま公開されてしまう。
# dbt 自身が次の run の冒頭で落とすものを、この run の後始末として済ませる
on-run-end: "{{ drop_build_leftovers() }}"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  houjin_bangou:
    +database: houjin_bangou
    main:
      raw:
        +materialized: table
      stg:
        +materialized: view
      mart:
        +materialized: table

schema: main
name: mart_houjin_bangou
title: 国税庁法人番号
description: 国税庁が公表する全国の法人番号（現存法人の最新情報のみ）。検索対象除外・登記閉鎖済みを除いた約500万法人を収録
published: true
sources:
  - path: https://www.houjin-bangou.nta.go.jp/
fields:
  - name: corporate_number
    title: 法人番号
    description: 13桁
  - name: seq
    title: 一連番号
    description: ファイル内の連番（恒久的な識別子ではない）
  - name: process
    title: 処理区分
    description: 01=新規、11=商号変更、12=所在地変更、21=登記記録の閉鎖等 等
  - name: correct
    title: 訂正区分
    description: 0=訂正以外、1=訂正
  - name: update_date
    title: 更新年月日
  - name: change_date
    title: 変更年月日
  - name: name
    title: 商号又は名称
  - name: kind
    title: 法人種別
    description: 101=国の機関、201=地方公共団体、301=株式会社、302=有限会社、303=合名会社、304=合資会社、305=合同会社、399=その他の設立登記法人、401=外国会社等、499=その他
  - name: prefecture_name
    title: 都道府県名
  - name: city_name
    title: 市区町村名
  - name: street_number
    title: 丁目番地等
  - name: prefecture_code
    title: 都道府県コード
    description: 2桁（JIS X0401）
  - name: city_code
    title: 市区町村コード
    description: 3桁（JIS X0402 の市区町村部分）
  - name: lg_code
    title: 全国地方公共団体コード
    description: 6桁（JIS X0402、チェックディジット付き）。dataset-lg-code / dataset-zipcode と結合できる
  - name: post_code
    title: 郵便番号
    description: 7桁
  - name: address_outside
    title: 国外所在地
  - name: change_cause
    title: 変更事由の詳細
  - name: assignment_date
    title: 法人番号指定年月日
  - name: name_en
    title: 商号又は名称（英語）
  - name: prefecture_en
    title: 国内所在地都道府県（英語）
  - name: city_street_en
    title: 国内所在地市区町村丁目番地等（英語）
  - name: address_outside_en
    title: 国外所在地（英語）
  - name: furigana
    title: フリガナ

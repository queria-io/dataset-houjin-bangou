schema: main
name: mart_houjin_bangou_history
title: 国税庁法人番号の変更履歴
description: |-
  法人番号ごとの新規・商号変更・所在地変更・登記記録の閉鎖などの履歴です。1 行が 1 回の変更の後の状態で、閉鎖した法人も含みます。旧商号から法人番号を検索できます。

  - 取り込みを始めた時点の全件データの状態を各法人の最初の行とし、それ以降の変更を日次の差分データから追加しています。それより前の変更は、差分データに過去の履歴が含まれていた法人だけが持ちます
  - 検索対象除外の法人は含みません
sources:
  - path: https://www.houjin-bangou.nta.go.jp/
fields:
  - name: corporate_number
    title: 法人番号
    description: 13桁
    annotations: { queria: { semantic: { role: entity, name: corporate_number } } }
  - name: history_seq
    title: 履歴の順番
    description: 法人番号ごとに変更年月日の古い順に 1 から振った番号
  - name: is_latest
    title: 最新の行
    description: その法人の最後の行なら true
  - name: process
    title: 処理区分
    description: 01=新規、11=商号又は名称の変更、12=国内所在地の変更、13=国外所在地の変更、21=登記記録の閉鎖等、22=登記記録の閉鎖等の消除、71=吸収合併、72=吸収合併無効、81=商号の登記の抹消、99=削除
  - name: correct
    title: 訂正区分
    description: 0=訂正以外、1=訂正
  - name: change_date
    title: 変更年月日
  - name: next_change_date
    title: 次の変更年月日
    description: 同じ法人の次の行の変更年月日。最新の行では NULL
  - name: update_date
    title: 更新年月日
  - name: name
    title: 商号又は名称
  - name: previous_name
    title: 変更前の商号又は名称
    description: 前の行と商号が違う行だけに入る
  - name: kind
    title: 法人種別
    description: 101=国の機関、201=地方公共団体、301=株式会社、302=有限会社、303=合名会社、304=合資会社、305=合同会社、399=その他の設立登記法人、401=外国会社等、499=その他
  - name: prefecture_name
    title: 都道府県名
  - name: city_name
    title: 市区町村名
  - name: street_number
    title: 丁目番地等
  - name: prefecture_code
    title: 都道府県コード
    description: 2桁（JIS X0401）
    annotations: { queria: { semantic: { role: entity, name: prefecture } } }
  - name: city_code
    title: 市区町村コード
    description: 3桁（JIS X0402 の市区町村部分）
  - name: lg_code
    title: 全国地方公共団体コード
    description: 全国地方公共団体コード（6 桁、チェックディジット付き）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: post_code
    title: 郵便番号
    description: 7桁
    annotations: { queria: { semantic: { role: entity, name: postal_code } } }
  - name: address_outside
    title: 国外所在地
  - name: close_date
    title: 登記記録の閉鎖等年月日
  - name: close_cause
    title: 登記記録の閉鎖等の事由
    description: 01=清算の結了等、11=合併による解散等、21=登記官による閉鎖、31=その他の清算の結了等
  - name: successor_corporate_number
    title: 承継先法人番号
    description: 合併で解散した法人の承継先
  - name: change_cause
    title: 変更事由の詳細
  - name: assignment_date
    title: 法人番号指定年月日
  - name: name_en
    title: 商号又は名称（英語表記）
  - name: furigana
    title: フリガナ

spec_version: "0.1"
name: houjin_bangou
title: 国税庁法人番号
description: 国税庁が公表している全国の法人番号（全件データ）。約500万の現存法人の商号・所在地・法人種別を収録
keywords:
  - 法人番号
  - 企業マスタ
  - 国税庁
homepage: https://github.com/queria-io/dataset-houjin-bangou
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 国税庁法人番号公表サイト
    path: https://www.houjin-bangou.nta.go.jp/

contributors:
  - title: 国税庁
    path: https://www.nta.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly
cover: 🏢

ai_context:
  instructions: |
    法人番号から法人名・所在地を引く、他のデータセットを法人番号で名寄せする、
    地域別・法人種別別に法人数を数える、といった用途に使う。
    収録は現存法人の最新情報のみ（500万2310件）。最新履歴・検索対象除外でない・
    登記閉鎖でないものに絞ってあるので、閉鎖された法人や過去の商号は入っていない。
    時点のスナップショットで、法人番号ごとの履歴は持たない。
    法人番号は13桁で、gbizinfo・edinet・p_portal と結合できる。
    ただし個人事業主は法人番号を持たないので、事業者全体をカバーするものではない。
    国内所在地は都道府県名・市区町村名・丁目番地等に分かれ、lg_code（6桁）も持つので
    lg_code / zipcode / address_br と結合できる。国外所在地は別の列に入る。
    kind は法人種別コード（301=株式会社、302=有限会社、305=合同会社 など）。
    商号は登記上の表記なので、「株式会社」の前後や旧字体の揺れがある。名寄せには注意が要る。
  synonyms: [法人番号, 企業マスタ, 商業登記, 国税庁]
  examples:
    - 法人番号から会社名と所在地を引きたい
    - 都道府県別の株式会社の数を出したい
    - 市区町村ごとの法人数を人口と並べたい

schemas:
  - name: main
    title: 法人情報マスタ

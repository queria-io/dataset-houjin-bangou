name: Sync (daily diff)

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 05:00 JST
  workflow_dispatch:

# 月次フル(sync.yml)と同一テーブルを書き換えるため、同じ concurrency group で直列化する
concurrency:
  group: houjin-build
  cancel-in-progress: false

jobs:
  sync-daily:
    runs-on: ubuntu-latest
    # Checkpoint も同じカタログに push する。並行して走ると、後から push した側が
    # 先の push の最中にカタログを変えてしまい、先の側が "The dataset changed while
    # this push was running" で落ちる。Checkpoint は dataset-shared の reusable を
    # 経由し、そちらの job が同じ group に入っているので、ここでも同じ group を書く。
    # 上の houjin-build は月次フルとの直列化で、Checkpoint はまたがない。
    #
    # 走っている側は止めない。push の途中で切ると、公開されたカタログと
    # データファイルの対応が途中の状態で残る
    concurrency:
      group: queria-catalog-write
      cancel-in-progress: false
      # 既定の queue: single は pending を 1 つしか持てず、後から来た run が
      # 待っている run を蹴る。月 1 回の Checkpoint が日次の列に埋もれないよう、
      # 待てる数を増やす
      queue: max
    env:
      PYTHONUNBUFFERED: "1"
      HOUJIN_MODE: incremental
      # queria は誰のデータセットに書くのかをトークンから決める。R2 の鍵は渡さない
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      # queria はベータ開発中のため、常に最新版を使用する
      - run: uv lock --upgrade-package queria && uv sync

      # 差分(diff_YYYYMMDD)の未取込分のみ取り込み公開まで実行する。
      # スキーマは変わらないため catalog 再ビルドは起こさない(月次フルに任せる)。
      - name: Apply daily diffs
        run: scripts/build.sh

  notify-failure:
    runs-on: ubuntu-latest
    needs: sync-daily
    if: failure()
    steps:
      - name: Notify Discord on failure
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"Sync (daily diff) Failed\", \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"color\": 15158332, \"fields\": [{\"name\": \"Repository\", \"value\": \"${{ github.repository }}\"}, {\"name\": \"Run\", \"value\": \"${{ github.run_id }}\"}]}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

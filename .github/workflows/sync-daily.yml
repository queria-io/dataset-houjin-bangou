name: Sync (daily diff)

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 05:00 JST
  workflow_dispatch:

# 月次フル(sync.yml)と同一テーブルを書き換えるため、同じ concurrency group で直列化する
concurrency:
  group: houjin-build
  cancel-in-progress: false

jobs:
  # 差分(diff_YYYYMMDD)の未取込分のみ取り込み公開まで実行する
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@185735942e853f2534200d67aacef11611145149
    with:
      mode: incremental
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
